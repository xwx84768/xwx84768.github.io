---
layout: default
---

{% include base_path %}

<div id="main" role="main">
  {% include sidebar.html %}

  <article class="page pub-detail" itemscope itemtype="http://schema.org/ScholarlyArticle">
    <div class="page__inner-wrap">
      <header>
        <p class="pub-detail__back"><a href="{{ base_path }}/#publications">&larr; All publications</a></p>
        <h1 class="page__title" itemprop="headline">{{ page.title }}</h1>
        {% include publication-meta.html pub=page %}
      </header>

      <section class="page__content" itemprop="description">
        {% if page.image %}
          <div class="pub-detail__figure">
            <a href="{{ base_path }}/images/{{ page.image }}">
              <img src="{{ base_path }}/images/{{ page.image }}" alt="Overview figure for {{ page.short | default: page.title }}">
            </a>
          </div>
        {% endif %}

        {{ content }}
      </section>
    </div>
  </article>
</div>
